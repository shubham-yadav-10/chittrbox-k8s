# These are the env vars the backend code actually needs (see backend/src/lib/utils.js
# and backend/src/lib/cloudinary.js) but which were missing from backend-deployment.yml.
# Without JWT_SECRET, every signup/login request crashes the pod with a 500.
# CLOUDINARY_* is only needed for profile-picture / chat-image uploads - the app runs
# without it, that one feature just won't work until you fill in real values.
#
# Replace the placeholder values below with your own before applying, or run:
#   kubectl create secret generic chatapp-secrets -n chat-app \
#     --from-literal=JWT_SECRET=<your-random-string> \
#     --from-literal=CLOUDINARY_CLOUD_NAME=<your-cloud-name> \
#     --from-literal=CLOUDINARY_API_KEY=<your-api-key> \
#     --from-literal=CLOUDINARY_API_SECRET=<your-api-secret>
apiVersion: v1
kind: Secret
metadata:
  name: chatapp-secrets
  namespace: chat-app
type: Opaque
stringData:
  JWT_SECRET: "601623fb9a4a4ba12717989ca239b103f2b2a662746478ce80241ed48aca5293"
  CLOUDINARY_CLOUD_NAME: "your_cloudinary_cloud_name"
  CLOUDINARY_API_KEY: "your_cloudinary_api_key"
  CLOUDINARY_API_SECRET: "your_cloudinary_api_secret"
